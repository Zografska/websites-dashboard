name: Test and deploy

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }

concurrency: { group: pages, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: playwright-report }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - run: test -f public/data/firms/FDUMMY.enc || (echo "public/data/firms/ is empty — run npm run encrypt:firms and copy the files there" && exit 1)
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Engagement tracking is on only when the POSTHOG_KEY repository variable is set
      # (ANALYTICS_SPEC §4.3). The test job never sees it.
      - run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          # One encrypted file per firm, each opened with that firm's own passphrase.
          VITE_PER_FIRM: '1'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v5
